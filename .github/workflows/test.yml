name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned to the image with macOS 27 and Xcode 27, the system ClamDown is built and checked on.
    # `macos-latest` moves to a new macOS by itself; change this label on purpose instead.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build
      - name: Test with coverage limits
        # RenderTests writes a render that differs from its reference to the temporary directory, as failed-*.png.
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/coverage.sh
      - name: Keep the failed renders
        # The references are recorded on a developer's Mac. Where the runner's macOS lays the views out differently,
        # the render kept here shows how, and is the one to look at and commit as the reference.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-renders
          path: ${{ runner.temp }}/failed-*.png
          if-no-files-found: ignore
